name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  db:
    name: Database (migrations + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Local Supabase in CI only; synthetic data, no cloud services (PRD §10 exception).
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit
      - name: Rebuild database from migrations
        run: supabase db reset
      - name: Run pgTAP tests
        run: supabase test db
      - name: Generated types are current
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          npx prettier --write /tmp/database.types.ts
          diff -u src/lib/database.types.ts /tmp/database.types.ts

  e2e:
    name: Playwright (mobile smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # No secrets: the home page is static placeholder content.
      - run: npm run check:e2e
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-not-a-secret
