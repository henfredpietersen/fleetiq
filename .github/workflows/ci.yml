name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  db:
    name: Database (migrations + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Local Supabase in CI only; synthetic data, no cloud services (PRD §10 exception).
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit
      - name: Rebuild database from migrations
        run: supabase db reset
      - name: Run pgTAP tests
        run: supabase test db
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Integration tests (auth, MFA, service-role isolation, private evidence storage)
        run: |
          supabase status -o env | sed 's/^/export /' > /tmp/sb.env
          . /tmp/sb.env
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          npm run test:int
      - name: Generated types are current
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          npx prettier --write /tmp/database.types.ts
          diff -u src/lib/database.types.ts /tmp/database.types.ts

  e2e:
    name: "Playwright (mobile: smoke + sign-in)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Local Supabase in CI only; synthetic users seeded by e2e/global-setup.ts (no cloud, no real data).
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit
      - name: Sign-in end-to-end on a mobile viewport
        run: |
          supabase status -o env | sed 's/^/export /' > /tmp/sb.env
          . /tmp/sb.env
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export CI=true E2E_AUTH=1
          npm run check:e2e
